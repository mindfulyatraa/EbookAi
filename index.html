    <script src="https://cdn.tailwindcss.com"></script>

      tailwind.config = {
        theme: {
          extend: {

    <style>
      /* Custom scrollbar for a cleaner reading experience */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fbf7ef; 
      }
      ::-webkit-scrollbar-thumb {
        background: #d9b98a; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bf864e; 
      }
      .print-hide {
        display: block;
      }
      @media print {
        .print-hide {
          display: none !important;
        }
        .print-break {
          page-break-before: always;
        }
        body {
          background-color: white;
        }
      }
    </style>
